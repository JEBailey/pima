[package]
name = "pima"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]
members = ["pima-egui", "pima-language-server"]
resolver = "2"

[dependencies]
ariadne = "0.6"
camino = "1.2"
clap = "4.6"
dumpster = "2.1"
indexmap = "2.14"
logos = "0.16"
serde_json = "1"

[dev-dependencies]
criterion = "0.8.2"
insta = "1.47"
proptest = "1.11"

[[bench]]
name = "language"
harness = false
